<ion-header>
  <ion-toolbar color="success">
    <ion-title>Pago exitoso</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="flex flex-col items-center justify-center h-full gap-6 text-center">

    @if (verificando()) {
      <ion-spinner name="crescent" color="primary"></ion-spinner>
      <p class="text-gray-500">Confirmando tu pago...</p>
    }

    @if (!verificando() && confirmado()) {
      <ion-icon name="checkmark-circle-outline" class="text-green-500" style="font-size: 5rem;"></ion-icon>
      <h2 class="text-2xl font-bold text-gray-800">¡Pago confirmado!</h2>
      <p class="text-gray-500">Tu reserva ha sido pagada exitosamente.</p>
      <ion-button expand="block" color="primary" (click)="irAReservas()">
        Ver mis reservas
      </ion-button>
    }

    @if (!verificando() && !confirmado()) {
      <p class="text-gray-500">Redirigiendo...</p>
    }

  </div>
</ion-content>
