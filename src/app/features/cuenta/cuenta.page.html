<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Mi cuenta</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <!-- Profile header card -->
  <div class="rounded-2xl overflow-hidden mb-6 shadow-sm"
       style="background: linear-gradient(135deg, var(--ion-color-primary) 0%, var(--ion-color-secondary) 100%)">
    <div class="flex flex-col items-center py-8 px-4 text-white">
      <!-- Avatar con iniciales -->
      <div class="mb-3">
        <app-user-avatar
          [firstName]="session()?.primerNombre ?? ''"
          [lastName]="session()?.primerApellido ?? ''"
          size="lg"
        ></app-user-avatar>
      </div>
      <h2 class="page-title">
        {{ session()?.primerNombre }} {{ session()?.primerApellido }}
      </h2>
      <p class="text-sm text-white/75 mt-1">{{ session()?.email }}</p>
      <ion-badge color="light" class="mt-3">{{ session()?.role }}</ion-badge>
    </div>
  </div>

  <!-- Acciones de cuenta -->
  <div class="mb-6">
    <p class="text-xs tracking-widest uppercase text-tertiary font-semibold mb-3">Configuración</p>

    <div class="bg-surface rounded-2xl shadow-sm overflow-hidden">
      <a routerLink="/auth/change-password"
         class="flex items-center gap-3 px-4 py-4 cursor-pointer hover:bg-gray-50 transition-colors duration-200 border-b border-gray-100">
        <div class="w-9 h-9 rounded-xl bg-primary-light flex items-center justify-center flex-shrink-0">
          <ion-icon name="key-outline" class="text-primary"></ion-icon>
        </div>
        <span class="flex-1 text-sm font-medium text-gray-800">Cambiar contraseña</span>
        <ion-icon name="chevron-forward-outline" class="text-gray-300"></ion-icon>
      </a>

      <button
        (click)="logout()"
        class="w-full flex items-center gap-3 px-4 py-4 cursor-pointer hover:bg-red-50 transition-colors duration-200 text-left"
        aria-label="Cerrar sesión">
        <div class="w-9 h-9 rounded-xl bg-red-50 flex items-center justify-center flex-shrink-0">
          <ion-icon name="log-out-outline" class="text-danger"></ion-icon>
        </div>
        <span class="flex-1 text-sm font-medium text-danger">Cerrar sesión</span>
      </button>
    </div>
  </div>

  <app-footer></app-footer>

</ion-content>
