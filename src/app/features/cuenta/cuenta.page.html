<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Mi cuenta</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <!-- Profile header card con gradiente -->
  <div class="rounded-2xl overflow-hidden mb-6 shadow-sm"
       style="background: linear-gradient(135deg, var(--ion-color-primary) 0%, var(--ion-color-secondary) 100%)">
    <div class="flex flex-col items-center py-8 px-4 text-white">
      <div class="w-20 h-20 rounded-full bg-white/20 flex items-center justify-center mb-3">
        <ion-icon name="person-circle-outline" class="text-5xl text-white"></ion-icon>
      </div>
      <h2 class="page-title">
        {{ session()?.primerNombre }} {{ session()?.primerApellido }}
      </h2>
      <p class="text-sm text-white/75 mt-1">{{ session()?.email }}</p>
      <ion-badge color="light" class="mt-3">{{ session()?.role }}</ion-badge>
    </div>
  </div>

  <!-- Acciones -->
  <div class="mb-3">
    <p class="text-xs tracking-widest uppercase text-tertiary font-semibold mb-3">Configuración</p>
  </div>

  <div class="flex flex-col gap-3 max-w-sm mx-auto">
    <ion-button routerLink="/auth/change-password" expand="block" fill="outline">
      <ion-icon name="key-outline" slot="start"></ion-icon>
      Cambiar contraseña
    </ion-button>

    <ion-button color="danger" expand="block" fill="outline" (click)="logout()">
      <ion-icon name="log-out-outline" slot="start"></ion-icon>
      Cerrar sesión
    </ion-button>
  </div>

  <app-footer></app-footer>

</ion-content>
